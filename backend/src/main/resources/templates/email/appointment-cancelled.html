<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.appointment.cancelled.pagetitle}">Cita Cancelada</title>
</head>
<body style="margin:0; padding:0; background-color:#E8EFE6; font-family: Georgia, 'Times New Roman', serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 48px 16px;">
        <tr>
            <td align="center">
                <table width="520" cellpadding="0" cellspacing="0"
                    style="background-color:#FFFDF8; border-radius:6px; overflow:hidden; border:1px solid #B9D4BC;">

                    <tr>
                        <td style="background-color:#015C39; height:8px; line-height:8px; font-size:1px;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td style="background-color:#019F62; padding: 30px 40px 22px; text-align:center;">
                            <table cellpadding="0" cellspacing="0" style="margin:0 auto 10px;">
                                <tr>
                                    <td style="width:22px; height:22px; background-color:#8FD4AE; border-radius:0 100% 0 100%;">&nbsp;</td>
                                    <td style="width:10px;">&nbsp;</td>
                                    <td style="width:22px; height:22px; background-color:#B7E4C7; border-radius:100% 0 100% 0;">&nbsp;</td>
                                    <td style="width:10px;">&nbsp;</td>
                                    <td style="width:22px; height:22px; background-color:#8FD4AE; border-radius:0 100% 0 100%;">&nbsp;</td>
                                </tr>
                            </table>
                            <p style="margin:0; color:#DFF3E6; font-size:12px; letter-spacing:3px; text-transform:uppercase;">
                                My Green Farm
                            </p>
                            <h1 th:text="#{email.header.daycare}" style="margin:6px 0 0; color:#FFFFFF; font-size:24px; font-weight:normal;">
                                Guardería
                            </h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#CFE8D6; height:14px; line-height:14px; font-size:1px;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td style="padding: 32px 40px 8px;">
                            <h2 th:text="#{email.appointment.cancelled.title}" style="color:#A94442; font-size:19px; margin:0 0 16px; font-weight:normal;">
                                Cita Cancelada
                            </h2>
                            <p style="color:#3F4A3B; font-size:15.5px; line-height:1.75; margin:0 0 16px;">
                                <span th:text="#{email.appointment.cancelled.body}">Te informamos que la cita programada para</span> 
                                <strong th:text="${childName}" style="color:#015C39;"></strong> 
                                <span th:text="#{email.appointment.cancelled.body2}">ha sido cancelada. Puedes agendar una nueva fecha cuando gustes.</span>
                            </p>

                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="border-top:2px dashed #B9D4BC; font-size:1px; line-height:1px;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 22px 40px 8px; text-align:center;">
                            <p style="color:#8A9686; font-size:12.5px; margin:0;">
                                <span th:text="#{email.footer.help}">¿Necesitas ayuda? Escríbenos a</span>
                                <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}"
                                style="color:#019F62; text-decoration:none; border-bottom:1px solid #019F62;"></a>
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#019F62; padding: 14px; text-align:center;">
                            <p th:text="#{email.footer.slogan}" style="margin:0; color:#DFF3E6; font-size:11px; letter-spacing:1px;">
                                CRECIENDO JUNTO A LA NATURALEZA
                            </p>
                        </td>
                    </tr>
                </table>

                <p style="color:#8A9686; font-size:11px; margin-top:18px; font-family:Georgia, serif;">
                    My Green Farm — <span th:text="#{email.header.daycare}">Guardería</span>
                </p>
            </td>
        </tr>
    </table>
</body>
</html>

spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/postgres?prepareThreshold=0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
resend.token=${RESEND_TOKEN}
frontend.url=${FRONTEND_URL}
frontend.origin=${FRONTEND_ORIGIN}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.from=${MAIL_FROM}
mail.support=${MAIL_SUPPORT}

google.cloud.credentials-json=${GOOGLE_CLOUD_CREDENTIALS_JSON:}
google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID:}

supabase.s3.endpoint=${SUPABASE_ENDPOINT}
supabase.s3.region=${SUPABASE_REGION}
supabase.s3.buckets.announcements=${SUPABASE_ANNOUNCEMENTS}
supabase.s3.buckets.gallery=${SUPABASE_GALLERY}
supabase.s3.buckets.expedients=${SUPABASE_EXPEDIENTS}
supabase.s3.buckets.service-plans=${SUPABASE_SERVICE_PLANS}
supabase.s3.access-key=${SUPABASE_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_SECRET_KEY}

mygreenfarm.app.jwtSecret=${JWT_SECRET}
mygreenfarm.app.jwtExpirationMs=${JWT_EXPIRATION_MS}

google.calendar.credentials.path=${CALENDAR_CREDENTIALS_PATH}
google.calendar.id=${CALENDAR_ID}
daycare.mail.admin={DAYCARE_MAIL_ADMIN}
GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}

onvo.api.key=${ONVO_API_KEY}
onvo.api.url=${ONVO_API_URL}
payments.success.url=${PAYMENTS_SUCCESS_URL}
payments.cancel.url=${PAYMENTS_CANCEL_URL}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL}
gemini.base-url=${GEMINI_BASE_URL}
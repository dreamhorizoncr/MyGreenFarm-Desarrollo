spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/postgres
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
resend.token=${RESEND_TOKEN}
frontend.url=${FRONTEND_URL}
frontend.origin=${FRONTEND_ORIGIN}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.from=${MAIL_FROM}
mail.support=${MAIL_SUPPORT}

supabase.s3.endpoint=${SUPABASE_ENDPOINT}
supabase.s3.region=${SUPABASE_REGION}
supabase.s3.buckets.announcements=${SUPABASE_ANNOUNCEMENTS}
supabase.s3.access-key=${SUPABASE_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_SECRET_KEY}

mygreenfarm.app.jwtSecret=${JWT_SECRET}
mygreenfarm.app.jwtExpirationMs=${JWT_EXPIRATION_MS}